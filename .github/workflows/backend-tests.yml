name: Backend tests

on:
  push:
    branches: [main, 'feature/order-rbac-refactor']
  pull_request:
    branches: [main, 'feature/order-rbac-refactor']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run all tests (MySQL via Testcontainers)
        run: bash gradlew clean build --no-daemon --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
