name: Backend tests

on:
  push:
    branches: [main, 'feature/order-rbac-refactor']
  pull_request:
    branches: [main, 'feature/order-rbac-refactor']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Postman runner
        run: npm install --prefix .phase5-tools --no-audit --no-fund newman@6.2.1
      - name: Compile and run all tests (MySQL via Testcontainers)
        run: bash gradlew clean build --no-daemon --console=plain
      - name: Check required matrix and save evidence
        if: always()
        run: python3 scripts/phase5_evidence.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          retention-days: 90
          path: |
            build/reports/tests/
            build/test-results/
            build/phase5/
          if-no-files-found: error
