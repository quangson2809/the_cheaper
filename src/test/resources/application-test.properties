# Test-only values. Connection details come from the managed MySQL container.
# If the container configuration is accidentally omitted, fail instead of using a local DB.
spring.datasource.url=jdbc:mysql://127.0.0.1:1/test_container_required
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Public test key only; never use outside tests.
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.expiration=3600000
jwt.refresh-expiration=86400000
app.otp.expiration-minutes=15
